<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset your password</title>
  </head>
  <body
    style="margin: 0; padding: 24px; background-color: #f4f6f8; font-family: Arial, sans-serif; color: #1f2937"
  >
    <table
      role="presentation"
      style="width: 100%; max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 12px"
    >
      <tr>
        <td style="padding: 32px">
          <h1 style="margin: 0 0 16px; font-size: 24px">
            Reset your password
          </h1>
          <p style="margin: 0 0 16px; line-height: 1.5">Hello, {{name}}!</p>
          <p style="margin: 0 0 24px; line-height: 1.5">
            We received a request to reset your password. This link is valid
            for 15 minutes.
          </p>
          <a
            href="{{{link}}}"
            style="display: inline-block; padding: 12px 20px; border-radius: 8px; background-color: #2563eb; color: #ffffff; text-decoration: none"
          >
            Reset password
          </a>
          <p style="margin: 24px 0 8px; line-height: 1.5">
            If the button does not work, copy and paste this link into your
            browser:
          </p>
          <p style="margin: 0; overflow-wrap: anywhere">
            <a href="{{{link}}}">{{{link}}}</a>
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
